{% load i18n %}
<article class="article-card h-full">
  {% if image %}<img class="article-image" src="{{ image }}" alt="{{ image_alt|default:title }}" loading="lazy" width="800" height="520">{% else %}<div class="article-image article-image-placeholder" aria-hidden="true"></div>{% endif %}
  <div class="pt-5">
    {% if category or published_at %}<div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-semibold text-ocean-600">{% if category %}<span>{{ category }}</span>{% endif %}{% if published_at %}<time datetime="{{ published_at|date:'Y-m-d' }}">{{ published_at|date }}</time>{% endif %}</div>{% endif %}
    <h3 class="mt-3 font-display text-xl font-semibold leading-snug tracking-tight text-ocean-950">{{ title }}</h3>
    <div class="ck-content mt-3 text-sm leading-6 text-muted">{{ summary|safe }}</div>
    {% if href %}<a class="card-link mt-5" href="{{ href }}">{% translate "Read article" %} <span aria-hidden="true">→</span></a>{% endif %}
  </div>
</article>
